<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Download ANDALUS GO</title>
  <meta name="description" content="Download the ANDALUS GO app for Android and iPhone.">
  <meta name="theme-color" content="#ec2826">
  <meta property="og:title" content="Download ANDALUS GO">

<body>
  <main class="page">
    <header class="brand">
      <!-- The logo already contains the "ANDALUS GO" wordmark, so the heading is kept for screen readers only. -->
      <img class="brand__logo" src="assets/logo.png" alt="ANDALUS GO" width="447" height="447">
      <h1 class="visually-hidden">ANDALUS GO</h1>
      <p class="brand__tagline">Shop Andalus Supermarket from your phone — fast, simple, always open.</p>
    </header>

    <!-- Shown only while an automatic redirect is in progress (mobile). -->

    <!--
      STORE LINKS — the single place to set them.
      The href values below are used both by the buttons and by the automatic redirect in script.js.
    -->
    <section class="stores" aria-label="Download the app">
      <a class="store-btn" id="link-android"
         href="https://play.google.com/store/apps/details?id=uz.prod.andalus.customer_app"
         rel="noopener">
        <svg class="store-btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>
        <span class="store-btn__text"><small>GET IT ON</small>Google Play</span>
      </a>
      <a class="store-btn" id="link-ios"
         href="https://apps.apple.com/app/andalus-go/id6757116995"
         rel="noopener">
        <svg class="store-btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
        <span class="store-btn__text"><small>Download on the</small>App Store</span>
      </a>
    </section>

    <!-- Desktop only: lets visitors scan this page with their phone. Filled by script.js. -->
    <section class="scan" id="scan" hidden>
      <div class="scan__code" id="scan-code" aria-label="QR code to open this page on your phone"></div>
      <p class="scan__text">On a computer? Scan with your phone's camera to download the app.</p>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year">2026</span> ANDALUS GO</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
